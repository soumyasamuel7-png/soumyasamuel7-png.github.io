lunr:
  search_within_pages :

algolia:
  application_id :
  index_name :
  search_only_api_key :
  powered_by :

google:
  search_engine_id :
  instant_search :

# SEO Related

google_site_verification : "WdB4Q-Jc5oxigFWkkODmnLUXnR6jlRzUhWMPxTpBuJg"
bing_site_verification :
naver_site_verification :
yandex_site_verification :
baidu_site_verification :

# Social Sharing

twitter:
  username :

facebook:
  username :
  app_id :
  publisher :

og_image : "/assets/images/social-preview.jpg"
og_image_alt : "Soumya Samuel - Data Governance Expert"

# For specifying social profiles

social:
  type : "Person"
  name : "Soumya Samuel"
  links:
    - "https://linkedin.com/in/soumyasamuel"
    - "https://github.com/soumyasamuel7-png"

# Analytics

