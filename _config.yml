url : "https://soumyasamuel7-png.github.io"
baseurl :
repository : "soumyasamuel7-png/soumyasamuel7-png.github.io"
teaser : "/assets/images/default-teaser.png"
breadcrumbs :
words_per_minute : 200
enable_copy_code_button :
copyright :
copyright_url :

comments:
  provider :
  disqus:
    shortname :
  discourse:
    server :
  facebook:
    appid :
    num_posts :
    colorscheme :
  utterances:
    theme :
    issue_term :
  giscus:
    repo_id :
    category_name :
    category_id :
    discussion_term :
    reactions_enabled :
    theme :
    strict :
    input_position :
    emit_metadata :
    lang :
    lazy :
  staticman:
    branch :
    endpoint :
    reCaptcha:
      siteKey :
      secret :

atom_feed:
